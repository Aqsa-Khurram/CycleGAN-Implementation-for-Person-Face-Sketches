<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face &harr; Sketch (CycleGAN)</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1f2430; --muted:#6b7280; --accent:#4f46e5; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141a; --card:#1b1e27; --ink:#e8eaf0; --muted:#9aa1b2; --line:#2b3040; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; } p.sub { margin: 0 0 22px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button, select { font: inherit; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=file] { display:none; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  .box { border:1px dashed var(--line); border-radius:12px; min-height:260px; display:flex; align-items:center; justify-content:center; flex-direction:column; overflow:hidden; }
  .box img, .box video { width:100%; display:block; }
  .box span.ph { color: var(--muted); padding: 20px; text-align:center; }
  h3 { margin: 0 0 10px; font-size: 1rem; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; background: var(--accent); color:#fff; font-size:.85rem; margin-left:8px; }
  #status { color: var(--muted); margin-top: 10px; min-height: 1.3em; }
  #status.err { color:#dc2626; }
</style>
</head>
<body>
<main>
  <h1>Face &harr; Sketch translator</h1>
  <p class="sub">Upload a picture or use your camera. The app detects whether it is a sketch or a real face and converts it with a CycleGAN.</p>

  <div class="card">
    <div class="row">
      <label for="file"><button type="button" onclick="document.getElementById('file').click()">&#128193; Upload image</button></label>
      <input id="file" type="file" accept="image/*">
      <button type="button" id="camBtn">&#128247; Use camera</button>
      <button type="button" id="snapBtn" style="display:none">&#9679; Capture</button>
      <label>Mode:
        <select id="mode">
          <option value="auto">Auto-detect</option>
          <option value="photo">It is a face photo</option>
          <option value="sketch">It is a sketch</option>
        </select>
      </label>
      <button type="button" class="primary" id="goBtn" disabled>Convert</button>
    </div>
    <div id="status">Choose an image to begin.</div>
  </div>

  <div class="grid">
    <div class="card"><h3>Input <span id="detected" class="badge" style="display:none"></span></h3>
      <div class="box" id="inBox"><span class="ph">No image yet</span></div></div>
    <div class="card"><h3>Result <span id="dir" class="badge" style="display:none"></span></h3>
      <div class="box" id="outBox"><span class="ph">The converted image will appear here</span></div></div>
  </div>
  <canvas id="cv" style="display:none"></canvas>
</main>

<script>
const $ = id => document.getElementById(id);
let blob = null, stream = null;

function setStatus(msg, err=false) { $('status').textContent = msg; $('status').className = err ? 'err' : ''; }
function showInput(url) { $('inBox').innerHTML = '<img src="' + url + '" alt="input">'; }

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  stopCamera(); blob = f; showInput(URL.createObjectURL(f));
  $('goBtn').disabled = false; setStatus('Image ready - press Convert.');
});

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.srcObject = stream; v.id = 'vid';
    $('inBox').innerHTML = ''; $('inBox').appendChild(v);
    $('snapBtn').style.display = ''; $('camBtn').textContent = 'Stop camera'; setStatus('Camera on - press Capture.');
  } catch (err) { setStatus('Camera not available: ' + err.message + ' (camera needs https or localhost).', true); }
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('snapBtn').style.display = 'none'; $('camBtn').innerHTML = '&#128247; Use camera';
}
$('camBtn').onclick = () => stream ? stopCamera() : startCamera();

$('snapBtn').onclick = () => {
  const v = $('vid'), c = $('cv'); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  c.toBlob(b => { blob = b; stopCamera(); showInput(URL.createObjectURL(b)); $('goBtn').disabled = false; setStatus('Photo captured - press Convert.'); }, 'image/jpeg', 0.92);
};

$('goBtn').onclick = async () => {
  if (!blob) return;
  $('goBtn').disabled = true; setStatus('Converting...');
  const fd = new FormData(); fd.append('image', blob, 'input.jpg'); fd.append('mode', $('mode').value);
  try {
    const r = await fetch('/convert', { method: 'POST', body: fd });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Server error');
    showInput(j.input);
    $('outBox').innerHTML = '<img src="' + j.output + '" alt="output">';
    $('detected').style.display = ''; $('detected').textContent = 'detected: ' + j.detected + ' (' + Math.round(j.confidence * 100) + '%)';
    $('dir').style.display = ''; $('dir').textContent = j.direction;
    setStatus('Done.');
  } catch (e) { setStatus(e.message, true); }
  $('goBtn').disabled = false;
};
</script>
</body>
</html>
